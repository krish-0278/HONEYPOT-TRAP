<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Identity Access | Secure Single Sign-On</title>
  <meta name="description" content="Authorized Corporate Single Sign-On Gateway.">

  <!-- Core Enterprise CSS -->
  <link rel="stylesheet" href="css/cyber-core.css">

  <style>
    body {
      background-color: var(--bg-page);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: min(440px, 100%);
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border-grey);
      border-radius: 8px;
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
    }

    .login-brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 44px;
      height: 44px;
      background-color: var(--bg-elevated);
      color: var(--champagne-gold);
      border: 1px solid var(--border-grey);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-heading);
      margin-bottom: 6px;
    }

    .role-pills {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      background-color: var(--bg-elevated);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border-grey);
    }

    .role-pill-btn {
      flex: 1;
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 0.8125rem;
      font-weight: 600;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .role-pill-btn.active {
      background-color: var(--bg-card);
      color: var(--primary-accent);
      border-color: var(--border-grey);
      box-shadow: var(--shadow-xs);
    }

    /* Error Banner for Failed-Login Messages */
    .failed-login-banner {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-red);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.8125rem;
      line-height: 1.45;
      margin-bottom: 20px;
      display: none;
      align-items: flex-start;
      gap: 10px;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <!-- Corporate Header -->
      <div class="login-brand-header">
        <div class="login-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1 class="login-title">Enterprise Single Sign-On</h1>
        <p class="login-subtitle">Secure corporate authentication gateway</p>
      </div>

      <!-- Role Selector -->
      <div class="role-pills">
        <button type="button" class="role-pill-btn active" onclick="selectRole('user', this)">
          Employee SSO
        </button>
        <button type="button" class="role-pill-btn" onclick="selectRole('admin', this)">
          Security Administrator
        </button>
      </div>

      <!-- Failed-Login Message Box (Muted Coral #C77B78) -->
      <div class="failed-login-banner" id="errorAlertBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; margin-top: 1px;">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" x2="12" y1="8" y2="12"/>
          <line x1="12" x2="12.01" y1="16" y2="16"/>
        </svg>
        <div id="errorAlertText">
          Authentication challenge failed. Unauthorized attempt logged by Honeypot Security Engine.
        </div>
      </div>

      <!-- Authentic Form Posting to Backend Honeypot Tripwire -->
      <form action="/login" method="POST" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username or Corporate Email</label>
          <input type="text" id="username" name="username" placeholder="name@company.com" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" onclick="injectSqlTest()" style="font-size: 0.75rem; color: var(--blue-links);">
              Insert SQLi Probe
            </a>
          </div>
          <input type="password" id="password" name="password" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 4px;">
          Sign In
        </button>
      </form>

      <hr class="divider">

      <div style="text-align: center; font-size: 0.8125rem; color: var(--text-muted);">
        Protected by Honeypot Deception Matrix v2.4
      </div>
    </div>

    <!-- Bottom Navigation Links in Mutual Teal #739F98 -->
    <div style="text-align: center; margin-top: 20px; font-size: 0.875rem;">
      <a href="index.html" style="color: var(--blue-links); font-weight: 500;">&larr; Return to Overview</a>
      <span style="color: var(--border-grey); margin: 0 10px;">|</span>
      <a href="admin.html" style="color: var(--blue-links); font-weight: 600;">Open SOC Console &rarr;</a>
    </div>
  </div>

  <script>
    function selectRole(role, btn) {
      document.querySelectorAll('.role-pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('username').value = role;
    }

    function injectSqlTest() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = "' OR 1=1 --";
    }

    // Check URL parameters for failure simulation
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('failed') || document.referrer.includes('login')) {
      const errorBox = document.getElementById('errorAlertBox');
      errorBox.style.display = 'flex';
    }
  </script>
</body>
</html>
