<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Enterprise Identity | Secure SSO Access Gateway</title>
  <meta name="description" content="Authorized Corporate Single Sign-On Access Gateway. Protected by Honeypot Threat Mitigation.">

  <!-- Core Cyber CSS -->
  <link rel="stylesheet" href="css/cyber-core.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .auth-container {
      width: min(440px, 100%);
      position: relative;
      z-index: 10;
    }

    .auth-card {
      padding: 38px 34px;
      background: rgba(12, 18, 30, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-medium);
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 25px rgba(56, 189, 248, 0.1);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(139, 92, 246, 0.2));
      border: 1px solid var(--cyan-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan-primary);
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .role-toggle-group {
      display: flex;
      gap: 8px;
      background: rgba(7, 10, 18, 0.7);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }

    .role-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .role-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(7, 10, 18, 0.8);
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .form-input:focus {
      border-color: var(--cyan-primary);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .auth-security-notice {
      margin-top: 24px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.15);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .back-home-link {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      transition: color var(--transition-fast);
    }
    .back-home-link:hover {
      color: var(--cyan-primary);
    }
  </style>
</head>

<body>
  <!-- Ambient Grid & Scanlines -->
  <div class="cyber-grid-overlay"></div>
  <div class="scanlines-overlay"></div>

  <div class="auth-container">
    <div class="auth-card glass-panel">
      <div class="auth-header">
        <div class="auth-logo-badge">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h2 style="font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--text-primary);">
          Identity Access Gateway
        </h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
          Enterprise SSO Authentication Portal v2.4
        </p>
      </div>

      <!-- Role Selector -->
      <div class="role-toggle-group">
        <button type="button" class="role-btn active" onclick="setRole('user', this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Employee SSO</span>
        </button>
        <button type="button" class="role-btn" onclick="setRole('admin', this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
          <span>Security Admin</span>
        </button>
      </div>

      <!-- Authentic Form Posting to Backend Honeypot Tripwire -->
      <form action="/login" method="POST">
        <div class="form-group">
          <label class="form-label">Corporate Username / Email</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="e.g. admin or employee@company.com" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin-bottom: 0;">Password / Key</label>
            <span style="font-size: 0.7rem; color: var(--cyan-primary); cursor: pointer;" onclick="autofillTestPayload()">Inject Test Payload</span>
          </div>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          <span>Authenticate Session</span>
        </button>
      </form>

      <div class="auth-security-notice">
        🔒 <strong>NOTICE:</strong> All connection attempts, source IPs, payloads, and telemetry are monitored and logged by the Honeypot Deception Matrix.
      </div>
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <a href="index.html" class="back-home-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" x2="5" y1="12" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Return to Honeypot Platform Home</span>
      </a>
      <span style="color: var(--text-muted); margin: 0 10px;">•</span>
      <a href="admin.html" class="back-home-link" style="color: var(--cyan-primary);">
        <span>Launch SOC Console &rarr;</span>
      </a>
    </div>
  </div>

  <script>
    function setRole(role, btn) {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('username').value = role;
    }

    function autofillTestPayload() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = "' OR 1=1 --";
    }
  </script>
</body>
</html>
